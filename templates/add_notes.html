<!DOCTYPE html>
<html lang="en">
<head>
    <style>
  textarea {
    width: 100%;
    min-height: 100px;
    resize: vertical;        /* user can drag taller, but not wider */
    field-sizing: content;   /* auto-grows as you type (modern browsers) */
  }
</style>
    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>add_notes</title>
</head>
<body>
    <form action = "/add" method="POST">
        <div>

            <input name = "title" type = "text" placeholder="TITLE" required>
        </div>
        <div>
            <textarea id = "msg" name = "content" rows = "4" placeholder="note anything you want" required>

            </textarea>
        </div>
        <div>
            <button type = "submit">submit</button>
        </div>
    </form>
    <div>
    <button><a href = "{{ url_for('dashboard' )}}"">BACK</a></button>
    </div>
    <script>
// Fallback for browsers that don't support field-sizing
const ta = document.getElementById('msg');
if (!CSS.supports('field-sizing', 'content')) {
  ta.style.resize = 'none';
  ta.style.overflow = 'hidden';
  ta.addEventListener('input', () => {
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 'px';
  });
}
</script>

</body>
</html>
