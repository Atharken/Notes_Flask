<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
</head>
<body>
    <form action = "login" method = 'POST'>
        <label id = email>email</label>
        <input name = "email" id = "email" type = "text" placeholder = "your@gmail.com" required>
        <br>
        <label id = pass>password</label>
        <input name = "pass" id = "pass" type = "text" placeholder = password required>
        <br>
        <button type = "submit">submit</button>
    </form>
    {% if error  %}
        <p>{{ error }}</p>
    {% endif %}
    </body>
</html>
